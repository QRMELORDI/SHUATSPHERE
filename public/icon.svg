<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <linearGradient id="globe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="192" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="url(#globe)" stroke-width="56" stroke-opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="512" cy="512" rx="330" ry="110" fill="none" stroke="white" stroke-width="24" stroke-opacity="0.6"/>
  <ellipse cx="512" cy="512" rx="110" ry="330" fill="none" stroke="white" stroke-width="24" stroke-opacity="0.6"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="white" stroke-width="16" stroke-opacity="0.3"/>
  <circle cx="336" cy="360" r="44" fill="#10B981" opacity="0.9"/>
  <circle cx="640" cy="400" r="32" fill="#F59E0B" opacity="0.9"/>
  <circle cx="440" cy="640" r="40" fill="#EC4899" opacity="0.9"/>
  <circle cx="680" cy="660" r="28" fill="#06B6D4" opacity="0.9"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="white" stroke-width="40" stroke-opacity="0.4" stroke-dasharray="60 40"/>
  <text x="512" y="880" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" fill="white" text-anchor="middle" opacity="0.95">SHUATSPHERE</text>
  <text x="512" y="960" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" opacity="0.7">shuats people here</text>
</svg>
